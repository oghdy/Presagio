# Alembic configuration. Run from the repo root, e.g. `uv run alembic upgrade head`.
# The database URL is NOT stored here: alembic/env.py reads DATABASE_URL via presagio.config
# (environment variable first, then .env), so credentials never land in a committed file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Revision files are named <rev>_<slug>.py, e.g. 0001_schema_v1.py (pass --rev-id 0002 ...).
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Format and lint newly generated revision files with the project's ruff.
hooks = ruff_format, ruff_check
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
