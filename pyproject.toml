[project]
name = "presagio"
version = "0.1.0"
description = "Daily NBA win-probability and total-points forecasts, validated against results and market odds."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "nba-api>=1.11.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Never fall back to the system (anaconda) interpreter; always use a uv-managed CPython.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
