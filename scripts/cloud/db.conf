# Connection values for the PostgreSQL 16 that runs INSIDE a Claude Code cloud session VM
# (P-040, D-052). Sourced by scripts/cloud-setup.sh and scripts/cloud/session-start.sh, and
# quoted in README "클라우드 세션" (a test keeps the three in sync).
#
# The password is not a secret: it only ever unlocks a database on a throwaway VM that holds no
# real data, the same idea as CI's ci-only-not-a-secret (D-029). Real secrets (ODDS_API_KEY) are
# never put here, in a cloud environment variable, or anywhere in the repository.
#
# 127.0.0.1, not localhost, for the same reason as .env.example: the server listens on IPv4 only.
CLOUD_DB_USER="presagio"
CLOUD_DB_PASSWORD="cloud-only-not-a-secret"
CLOUD_DB_NAME="presagio"
CLOUD_DB_HOST="127.0.0.1"
CLOUD_DB_PORT="5432"
CLOUD_DATABASE_URL="postgresql+psycopg://${CLOUD_DB_USER}:${CLOUD_DB_PASSWORD}@${CLOUD_DB_HOST}:${CLOUD_DB_PORT}/${CLOUD_DB_NAME}"
