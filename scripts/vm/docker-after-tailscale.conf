# /etc/systemd/system/docker.service.d/10-after-tailscale.conf (P-044, D-058).
# compose.vm.yml binds 5433 to the Tailscale address, which exists only once tailscaled has put
# it on tailscale0; a container started before that fails its port bind and is not retried.
# After= orders the start of tailscaled only, not the address, so ExecStartPre also waits up to
# 30 s for an IPv4 address on tailscale0 (then starts Docker anyway). Reboot without this file
# (2026-10-29): address at 17.4 s, container at 19.5 s after boot - in time, but by chance.
[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 30); do ip -4 -o addr show dev tailscale0 2> /dev/null | grep -q " inet " && exit 0; sleep 1; done; echo "tailscale0 has no IPv4 address after 30 s; starting Docker anyway"'
