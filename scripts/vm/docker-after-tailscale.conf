# /etc/systemd/system/docker.service.d/10-after-tailscale.conf (P-044, D-058).
# compose.vm.yml binds 5433 to the Tailscale address, which exists only once tailscaled has
# brought tailscale0 up; dockerd restarting the container before that fails the bind.
[Unit]
Wants=tailscaled.service
After=tailscaled.service
