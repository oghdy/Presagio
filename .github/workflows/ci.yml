# CI for every PR into main and every push to main.
# Two independent jobs so branch protection can require each one by name:
#   - lint-and-test: ruff check, ruff format --check, pytest (uv-managed Python from .python-version)
#                    against a real PostgreSQL 17 service container (DB tests must not skip)
#   - secret-scan:   gitleaks over the full commit history (pre-commit only sees staged changes)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Pushes to main never cancel or replace
# each other: each gets its own group (run_id), because GitHub also cancels a *pending* run
# in the same group when a newer one queues, even with cancel-in-progress: false.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      # Same image, user and database as docker-compose.yml / .env.example. The job starts
      # only after the health check passes. Host port 5433 matches local development.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: presagio
          # CI-only throwaway value for a container that lives for one job; not a secret.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: presagio
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U presagio -d presagio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # Same uv as the dev machine that wrote uv.lock.
          version: "0.12.10"
          enable-cache: true

      - name: Install dependencies
        # Python version comes from .python-version; --locked fails if uv.lock is stale.
        run: uv sync --locked

      - name: Ruff check
        run: uv run --locked ruff check --output-format=github .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Pytest
        env:
          # 127.0.0.1, not localhost (see .env.example). The user owns the database, so
          # migration tests can create and drop everything in it.
          DATABASE_URL: postgresql+psycopg://presagio:ci-only-not-a-secret@127.0.0.1:5433/presagio
          # Fail instead of skip when the database is unreachable: no silent skips in CI.
          PRESAGIO_REQUIRE_DB: "1"
        # -rs lists every skip with its reason, so a skip is visible in the log.
        run: uv run --locked pytest -q -rs

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Keep in sync with the gitleaks rev in .pre-commit-config.yaml.
      GITLEAKS_VERSION: "8.30.1"
      # From gitleaks_8.30.1_checksums.txt in the official GitHub release.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history of every remote branch and tag, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 5 --max-time 60 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan full git history
        # Scans the history of every ref the checkout fetched (all remote branches), because
        # gitleaks git defaults to `git log --all`. A secret on any branch fails this job on
        # every PR. To narrow it to the PR's own history, pass --log-opts=HEAD.
        run: gitleaks git --redact --verbose --no-banner .
